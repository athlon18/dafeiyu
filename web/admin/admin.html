<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>大肥鱼 边车后台 · 设计图</title>
<link rel="stylesheet" href="admin.css">
<script src="/lib/oml.min.js"></script>
</head>
<body>
<div class="app">
  <main class="pane">
    <header class="head">
      <div class="brand">大肥鱼</div>
      <div class="live"><span class="dot on"></span>已连 731905913385 · 在线 218</div>
      <div class="headbtns">
        <button class="ghost">闭麦</button>
        <button class="primary">保存</button>
      </div>
    </header>

    <section class="group">
      <h2>连哪儿</h2>
      <label class="row"><span>房间号</span><input value="731905913385"></label>
      <label class="row"><span>Cookie</span><input type="password" placeholder="留空＝游客"></label>
    </section>

    <section class="group">
      <h2>从哪儿出声</h2>
      <label class="row"><span>音色</span>
        <select><option>zh_CN-huayan-medium</option><option>zf_xiaobei</option></select>
      </label>
      <label class="row"><span>输出设备</span>
        <select><option>CABLE Input (VB-Audio Virtual Cable)</option><option>Voicemeeter Input (VB-Audio)</option><option>扬声器 (Realtek)</option></select>
      </label>
      <button class="ghost wide">试听一句</button>
    </section>

    <section class="group">
      <h2>她说什么<span class="hint">顺序＝优先级 · 关掉就不吭声</span></h2>
      <table class="grid">
        <thead><tr><th>什么时候</th><th>说什么</th><th></th></tr></thead>
        <tbody>
          <tr><td>有人送嘉年华</td><td><input value="感谢 {user} 的嘉年华"></td><td class="sw on"></td></tr>
          <tr><td>连到 10 个小心心</td><td><input value="{user} 连了 {count} 个小心心"></td><td class="sw on"></td></tr>
          <tr><td>有人进直播间</td><td><input value="欢迎 {user}"></td><td class="sw on"></td></tr>
          <tr><td>没人说话时每 3 分钟</td><td><input value="想看下一局的扣个 1"></td><td class="sw on"></td></tr>
          <tr><td>安静满 1 分钟</td><td><input value="刚进来的先坐，一会儿开新一轮"></td><td class="sw on"></td></tr>
          <tr><td>主播下播</td><td><input value="今天就到这里，先下了"></td><td class="sw on"></td></tr>
        </tbody>
      </table>
      <button class="ghost wide">加一条</button>
    </section>
  </main>

  <aside class="stage">
    <div class="canvas">
      <div class="design">
        <div id="live2d"></div>
        <div class="caption">感谢 老板甲 的嘉年华</div>
        <div class="credit">模型：Mao绒绒家园</div>
      </div>
    </div>
  </aside>
</div>
<script src="admin.js"></script>
</body>
</html>
